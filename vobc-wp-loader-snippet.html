<!--
  VOBC Chatbot — WordPress loader snippet.

  Paste this into WPCode once. Unlike the old approach (pasting the entire chatbot
  inline), this snippet just embeds the Netlify-hosted widget in an iframe — so every
  future fix is just `git push`, auto-deployed by Netlify, with NOTHING further to
  paste into WordPress ever again.

  The iframe starts small (just enough to cover the bubble + its tooltip) so it never
  blocks clicks on the rest of the page. The widget itself posts a message up to this
  loader when it opens/closes, so the iframe only expands to full chat-window size
  while it's actually open.
-->
<script>
(function () {
  var IFRAME_SRC = 'https://vobc-chatbot.netlify.app/vobc-chatbot.html';

  var CLOSED   = { width: '300px', height: '160px' };
  var OPEN_DESKTOP = { width: '450px', height: '660px' };
  var OPEN_MOBILE  = { width: '100vw', height: '600px' };

  var iframe = document.createElement('iframe');
  iframe.id = 'vobc-widget-frame';
  iframe.src = IFRAME_SRC;
  iframe.title = 'VOBC Help Desk';
  iframe.allow = 'clipboard-write';
  iframe.style.cssText =
    'position:fixed;bottom:0;right:0;border:none;z-index:99999;background:transparent;' +
    'width:' + CLOSED.width + ';height:' + CLOSED.height + ';' +
    'max-width:100vw;transition:width .2s ease,height .2s ease;';
  document.body.appendChild(iframe);

  window.addEventListener('message', function (e) {
    if (!e.data || e.data.vobcWidget !== true) return;
    var isMobile = window.innerWidth <= 480;
    var size = e.data.open ? (isMobile ? OPEN_MOBILE : OPEN_DESKTOP) : CLOSED;
    iframe.style.width  = size.width;
    iframe.style.height = size.height;
  });
})();
</script>
