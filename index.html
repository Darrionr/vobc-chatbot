<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOBC Help Desk</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Rubik:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rubik', Helvetica, Arial, sans-serif;
      background: transparent;
      overflow: hidden;
    }

    :root {
      --dark:     #222222;
      --navy:     #304975;
      --gold:     #ffbd54;
      --gold-dk:  #ffae2d;
      --text:     #333333;
      --light-bg: #ffffff;
      --border:   #e8e8e8;
    }

    /* ── FLOATING BUBBLE ──────────────────────────────── */
    #vobc-bubble {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: var(--navy);
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(48, 73, 117, 0.5);
      z-index: 10001;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    #vobc-bubble:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 26px rgba(48, 73, 117, 0.6);
    }
    #vobc-bubble svg { width: 28px; height: 28px; }

    /* ── TOOLTIP ──────────────────────────────────────── */
    #vobc-tooltip {
      position: fixed;
      bottom: 98px;
      right: 20px;
      background: var(--dark);
      color: #fff;
      padding: 9px 16px;
      border-radius: 22px;
      font-size: 13px;
      font-family: 'Rubik', sans-serif;
      white-space: nowrap;
      z-index: 10002;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
      box-shadow: 0 3px 14px rgba(0,0,0,0.22);
    }
    #vobc-tooltip::after {
      content: '';
      position: absolute;
      bottom: -5px;
      right: 26px;
      width: 10px;
      height: 10px;
      background: var(--dark);
      transform: rotate(45deg);
      border-radius: 1px;
    }
    #vobc-tooltip.show { opacity: 1; transform: translateY(0); }

    /* ── CHAT WINDOW ──────────────────────────────────── */
    #vobc-window {
      position: fixed;
      bottom: 100px;
      right: 24px;
      width: 370px;
      height: 570px;
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 12px 44px rgba(0,0,0,0.22);
      z-index: 10000;
      overflow: hidden;
      opacity: 0;
      transform: translateY(18px) scale(0.96);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    #vobc-window.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    /* ── HEADER ───────────────────────────────────────── */
    #vobc-header {
      background: #0A1E40;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #vobc-logo-wrap {
      position: relative;
      flex-shrink: 0;
    }
    #vobc-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3));
    }
    #vobc-online-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 11px;
      height: 11px;
      background: #25d366;
      border-radius: 50%;
      border: 2px solid #0A1E40;
    }
    #vobc-header-text { flex: 1; min-width: 0; }
    #vobc-header-title {
      color: #fff;
      font-family: 'Poppins', Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14.5px;
      letter-spacing: 0.2px;
    }
    #vobc-header-subtitle {
      color: rgba(255,255,255,0.58);
      font-size: 11.5px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #vobc-close-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.65);
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
      line-height: 1;
      transition: background 0.2s, color 0.2s;
    }
    #vobc-close-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

    /* ── MESSAGES ─────────────────────────────────────── */
    #vobc-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      scroll-behavior: smooth;
    }
    #vobc-messages::-webkit-scrollbar { width: 4px; }
    #vobc-messages::-webkit-scrollbar-track { background: transparent; }
    #vobc-messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .vobc-msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .vobc-msg-row.user { flex-direction: row-reverse; }

    .vobc-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
      font-family: 'Poppins', sans-serif;
    }
    .vobc-bubble-text {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 13.5px;
      line-height: 1.55;
      word-break: break-word;
    }
    .vobc-msg-row.bot  .vobc-bubble-text {
      background: #ffffff;
      color: var(--text);
      border: 1px solid #e8e8e8;
      border-bottom-left-radius: 4px;
    }
    .vobc-msg-row.user .vobc-bubble-text {
      background: var(--navy);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* ── TYPING INDICATOR ─────────────────────────────── */
    #vobc-typing {
      display: none;
      align-items: flex-end;
      gap: 8px;
    }
    .vobc-typing-dots {
      background: var(--light-bg);
      padding: 13px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .vobc-dot {
      width: 7px;
      height: 7px;
      background: #aaa;
      border-radius: 50%;
      animation: vobcBounce 1.4s ease-in-out infinite;
    }
    .vobc-dot:nth-child(2) { animation-delay: 0.2s; }
    .vobc-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes vobcBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ── QUICK REPLIES ────────────────────────────────── */
    #vobc-quick-replies {
      padding: 0 14px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      flex-shrink: 0;
    }
    .vobc-qr-btn {
      background: none;
      border: 1.5px solid var(--navy);
      color: var(--navy);
      border-radius: 20px;
      padding: 6px 13px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Rubik', Helvetica, Arial, sans-serif;
      font-weight: 500;
      line-height: 1.4;
      transition: background 0.2s, color 0.2s;
    }
    .vobc-qr-btn:hover { background: var(--navy); color: #fff; }

    /* ── INPUT AREA ───────────────────────────────────── */
    #vobc-input-area {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      gap: 8px;
      flex-shrink: 0;
      background: #fff;
    }
    #vobc-textarea {
      flex: 1;
      resize: none;
      border: 1.5px solid #ddd;
      border-radius: 22px;
      padding: 10px 14px;
      font-size: 13.5px;
      font-family: 'Rubik', Helvetica, Arial, sans-serif;
      line-height: 1.45;
      outline: none;
      overflow-y: auto;
      height: 40px;
      max-height: 80px;
      color: var(--text);
      background: #f9f9f9;
      transition: border-color 0.2s, background 0.2s;
    }
    #vobc-textarea:focus { border-color: var(--navy); background: #fff; }
    #vobc-textarea::placeholder { color: #bbb; }
    #vobc-send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--navy);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    #vobc-send-btn:hover   { background: var(--gold-dk); }
    #vobc-send-btn:active  { transform: scale(0.9); }
    #vobc-send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    #vobc-send-btn svg {
      width: 18px; height: 18px;
      fill: none; stroke: #fff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── FOOTER ───────────────────────────────────────── */
    #vobc-footer {
      padding: 6px 16px 10px;
      text-align: center;
      font-size: 10.5px;
      color: #bbb;
      flex-shrink: 0;
      background: #fafafa;
      border-top: 1px solid #f0f0f0;
      font-family: 'Rubik', sans-serif;
    }

    /* ── MOBILE ───────────────────────────────────────── */
    @media (max-width: 480px) {
      #vobc-window {
        right: 10px;
        left: 10px;
        width: auto;
        bottom: 80px;
        height: 520px;
        max-height: calc(100vh - 100px);
      }
      #vobc-bubble  { right: 16px; bottom: 16px; width: 56px; height: 56px; }
      #vobc-tooltip { right: 12px; bottom: 82px; font-size: 12px; }
    }
  </style>
</head>

  <!-- Messages -->
  <div id="vobc-messages" role="log" aria-live="polite">
    <!-- typing indicator is always the last node; messages are inserted before it -->
    <div id="vobc-typing">
      <div class="vobc-avatar">V</div>
      <div class="vobc-typing-dots">
        <div class="vobc-dot"></div>
        <div class="vobc-dot"></div>
        <div class="vobc-dot"></div>
      </div>
    </div>
  </div>

  <!-- Quick Replies -->
  <div id="vobc-quick-replies">
    <button class="vobc-qr-btn">How do I apply?</button>
    <button class="vobc-qr-btn">What programs do you offer?</button>
    <button class="vobc-qr-btn">How much does it cost?</button>
    <button class="vobc-qr-btn">When does the next quarter start?</button>
  </div>

  <!-- Input -->
  <div id="vobc-input-area">
    <textarea id="vobc-textarea"
              placeholder="Type a message…"
              rows="1"
              aria-label="Type your message"></textarea>
    <button id="vobc-send-btn" aria-label="Send message">
      <svg viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <!-- Footer -->
  <div id="vobc-footer">Powered by VOBC&nbsp;•&nbsp;AI responses may not be fully accurate</div>

</div>

<script>
  // ── CONFIG ────────────────────────────────────────────
  var API_KEY    = 'AIzaSyAJx1eMIzWgJLWXMO_h_z6LB9Ie8bkjAPE';
  var MODEL      = 'gemini-2.5-flash';
  var MAX_TOKENS = 300;

  var SYSTEM_PROMPT = [
    'Use plain text only. No markdown, no asterisks, no bullet symbols, no bold or italic formatting. Never use the term VETI or Associate in your responses — refer to it only as the Associate program. You are the official AI assistant for Victory Outreach Bible College (VOBC). You help prospective students, current students, and coordinators get answers about VOBC. Be warm, encouraging, and concise. Reflect the faith-based, mission-driven culture of VOBC. Keep responses under 150 words unless a detailed answer truly requires more. End answers to prospective students with a brief encouragement when appropriate.',
    '',
    'PROGRAMS:',
    '- Associate in Biblical and Theological Studies — 2-year program, 72 units total, 19 core courses + 5 elective courses',
    '- Bachelor in Christian Ministry — 1-year completion program (42 units, 6 Modules) for Associate graduates',
    '- Both programs available in English and Spanish',
    '- Spanish Bachelor: 18-month Zoom program, Saturday mornings, $75/unit',
    '',
    'TUITION (USA):',
    '- 3-unit course: $215',
    '- 1-unit course: $100',
    '- Audit: $100',
    '- Late fee: $20 after first day of class',
    '- Payment by credit card only through student account. No payment plans. No refunds (transfer to another course allowed within first week only).',
    '',
    'QUARTERS AND DATES (2026):',
    '- Winter: January 19',
    '- Spring: April 13',
    '- Summer: July 13',
    '- Fall: September 14',
    '- Course requests are due 45 days before each quarter start.',
    '',
    'ADMISSIONS:',
    '- Associate program: Apply via the MaestroSIS platform. No formal prerequisites.',
    '- Bachelor: Must have an Associate degree (or 2-year equivalent from another institution with official transcripts). Requires personal essay, two letters of recommendation (one personal, one ministry), and a $25 application fee. Send transcripts to: 250 W. Arrow Hwy, San Dimas, CA 91773.',
    '- Application responses within 1-2 business days.',
    '',
    'ACCREDITATION:',
    '- Recognized by BPPE (California)',
    '- Credits can transfer to partnering universities for accredited Bachelor\'s or Master\'s degrees.',
    '- VOBC is actively pursuing dual accreditation (WSCUC and ABHE).',
    '',
    'CONTACT:',
    '- Address: 250 W. Arrow Hwy., San Dimas, CA 91773',
    '- Phone: (909) 599-4437',
    '- Email: info@vobiblecollege.org',
    '- Office Hours: Monday through Friday, 9am to 5pm',
    '',
    'LEARNING FORMATS:',
    '- In-person (local extensions), live Zoom, online (self-paced), on-demand (pre-recorded, available anytime)',
    '- 71 active extensions worldwide',
    '',
    'COORDINATOR REQUIREMENTS:',
    '- Must be active church members and faithful tithers',
    '- Instructors and ministers cannot serve simultaneously as coordinators',
    '- Coordinators are tracked through an internal CRM system',
    '',
    'LOGOS PARTNERSHIP:',
    '- VOBC partners with Logos Bible Software for required textbooks',
    '- Students who purchase required texts through Logos receive the Logos Academic Basic plan (valued at over $1,700)',
    '- Textbooks are owned permanently and other Logos books are available at 50% discount',
    '',
    'If you do not know the answer to a question, respond with: "I don\'t have that information on hand. Please contact us at info@vobiblecollege.org or call (909) 599-4437 and our team will be happy to help."'
  ].join('\n');

  // ── STATE ────────────────────────────────────────────
  var chatHistory        = [];
  var autoOpenFired  = false;
  var firstMsgSent   = false;
  var autoOpenTimer  = null;

  // ── DOM ──────────────────────────────────────────────
  var bubble      = document.getElementById('vobc-bubble');
  var tooltip     = document.getElementById('vobc-tooltip');
  var win         = document.getElementById('vobc-window');
  var closeBtn    = document.getElementById('vobc-close-btn');
  var msgList     = document.getElementById('vobc-messages');
  var typingEl    = document.getElementById('vobc-typing');
  var qrContainer = document.getElementById('vobc-quick-replies');
  var textarea    = document.getElementById('vobc-textarea');
  var sendBtn     = document.getElementById('vobc-send-btn');

  // ── AUTO-OPEN SEQUENCE ───────────────────────────────
  setTimeout(function () {
    tooltip.classList.add('show');
    autoOpenTimer = setTimeout(function () {
      if (!autoOpenFired) openChat();
    }, 2500);
  }, 3500);

  function openChat() {
    autoOpenFired = true;
    win.classList.add('open');
    tooltip.classList.remove('show');
    textarea.focus();
  }

  function closeChat() {
    win.classList.remove('open');
  }

  // ── BUBBLE TOGGLE ────────────────────────────────────
  bubble.addEventListener('click', function () {
    if (win.classList.contains('open')) {
      closeChat();
    } else {
      autoOpenFired = true;
      clearTimeout(autoOpenTimer);
      openChat();
    }
  });

  closeBtn.addEventListener('click', closeChat);

  // ── WELCOME MESSAGE ──────────────────────────────────
  appendBot("Hi there! I'm the VOBC Help Desk. Whether you're exploring our programs, ready to apply, or need help as a current student — I'm here for you. What can I help you with today?");

  // ── MESSAGE HELPERS ──────────────────────────────────
  function escHtml(s) {
    return s
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function appendBot(text) {
    var row = document.createElement('div');
    row.className = 'vobc-msg-row bot';
    row.innerHTML =
      '<div class="vobc-avatar">V</div>' +
      '<div class="vobc-bubble-text">' + escHtml(text).replace(/\n/g, '<br>') + '</div>';
    msgList.insertBefore(row, typingEl);
    scrollBottom();
  }

  function appendUser(text) {
    var row = document.createElement('div');
    row.className = 'vobc-msg-row user';
    row.innerHTML =
      '<div class="vobc-bubble-text">' + escHtml(text).replace(/\n/g, '<br>') + '</div>';
    msgList.insertBefore(row, typingEl);
    scrollBottom();
  }

  function scrollBottom() {
    msgList.scrollTop = msgList.scrollHeight;
  }

  // ── SEND MESSAGE ─────────────────────────────────────
  function sendMessage(text) {
    text = text.trim();
    if (!text || sendBtn.disabled) return;

    if (!firstMsgSent) {
      firstMsgSent = true;
      qrContainer.style.display = 'none';
    }

    appendUser(text);
    textarea.value = '';
    textarea.style.height = '40px';

    chatHistory.push({ role: 'user', parts: [{ text: text }] });

    typingEl.style.display = 'flex';
    scrollBottom();
    sendBtn.disabled  = true;
    textarea.disabled = true;

    fetch('https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent?key=' + API_KEY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: chatHistory,
        generationConfig: { maxOutputTokens: MAX_TOKENS }
      })
    })
    .then(function (res) {
      if (!res.ok) { return res.json().then(function(e){ console.error('API response:', JSON.stringify(e)); throw new Error('HTTP ' + res.status); }); }
      return res.json();
    })
    .then(function (data) {
      var reply = data.candidates[0].content.parts[0].text.replace(/\*\*\*(.*?)\*\*\*/g, '$1').replace(/\*\*(.*?)\*\*/g, '$1').replace(/\*(.*?)\*/g, '$1').replace(/\*+/g, '');
      chatHistory.push({ role: 'model', parts: [{ text: reply }] });
      typingEl.style.display = 'none';
      appendBot(reply);
    })
    .catch(function (err) { console.error('VOBC API error:', err);
      typingEl.style.display = 'none';
      appendBot("I’m having trouble connecting right now. Please contact us at info@vobiblecollege.org or call (909) 599-4437.");
    })
    .finally(function () {
      sendBtn.disabled  = false;
      textarea.disabled = false;
      textarea.focus();
    });
  }

  // ── SEND BUTTON ──────────────────────────────────────
  sendBtn.addEventListener('click', function () {
    sendMessage(textarea.value);
  });

  // ── ENTER KEY ────────────────────────────────────────
  textarea.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(textarea.value);
    }
  });

  // ── AUTO-RESIZE TEXTAREA ─────────────────────────────
  textarea.addEventListener('input', function () {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 80) + 'px';
  });

  // ── QUICK REPLY BUTTONS ──────────────────────────────
  qrContainer.querySelectorAll('.vobc-qr-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      sendMessage(btn.textContent);
    });
  });
</script>
