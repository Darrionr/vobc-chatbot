<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOBC Help Desk</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Rubik:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Rubik', Helvetica, Arial, sans-serif;
      background: transparent;
      overflow: hidden;
    }

    :root {
      --dark:     #222222;
      --navy:     #304975;
      --navy-dk:  #0A1E40;
      --gold:     #ffbd54;
      --gold-dk:  #ffae2d;
      --text:     #333333;
      --light-bg: #ffffff;
      --border:   #e8e8e8;
    }

    /* ── FLOATING BUBBLE ──────────────────────────────── */
    #vobc-bubble {
      position: fixed; bottom: 24px; right: 24px;
      width: 62px; height: 62px; border-radius: 50%;
      background: var(--navy); border: none; outline: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(48,73,117,0.5); z-index: 10001;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    #vobc-bubble:hover { transform: scale(1.08); box-shadow: 0 6px 26px rgba(48,73,117,0.6); }
    #vobc-bubble svg { width: 28px; height: 28px; }

    /* ── TOOLTIP ──────────────────────────────────────── */
    #vobc-tooltip {
      position: fixed; bottom: 98px; right: 20px;
      background: var(--dark); color: #fff; padding: 9px 16px;
      border-radius: 22px; font-size: 13px; font-family: 'Rubik', sans-serif;
      white-space: nowrap; z-index: 10002; opacity: 0; transform: translateY(8px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none; box-shadow: 0 3px 14px rgba(0,0,0,0.22);
    }
    #vobc-tooltip::after {
      content: ''; position: absolute; bottom: -5px; right: 26px;
      width: 10px; height: 10px; background: var(--dark);
      transform: rotate(45deg); border-radius: 1px;
    }
    #vobc-tooltip.show { opacity: 1; transform: translateY(0); }

    /* ── CHAT WINDOW ──────────────────────────────────── */
    #vobc-window {
      position: fixed; bottom: 100px; right: 24px;
      width: 370px; height: 540px; max-height: calc(100vh - 200px);
      display: flex; flex-direction: column;
      background: #fff; border-radius: 18px;
      box-shadow: 0 12px 44px rgba(0,0,0,0.22); z-index: 10000;
      overflow: hidden; opacity: 0;
      transform: translateY(18px) scale(0.96);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
    }
    #vobc-window.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }

    /* ── HEADER ───────────────────────────────────────── */
    #vobc-header {
      background: var(--navy-dk); padding: 14px 16px;
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    #vobc-logo-wrap { position: relative; flex-shrink: 0; }
    #vobc-logo {
      width: 42px; height: 42px; object-fit: contain; display: block;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.3));
    }
    #vobc-online-dot {
      position: absolute; bottom: 1px; right: 1px;
      width: 11px; height: 11px; background: #25d366;
      border-radius: 50%; border: 2px solid var(--navy-dk);
    }
    #vobc-header-text { flex: 1; min-width: 0; }
    #vobc-header-title {
      color: #fff; font-family: 'Poppins', Helvetica, Arial, sans-serif;
      font-weight: 600; font-size: 14.5px; letter-spacing: 0.2px;
    }
    #vobc-header-subtitle {
      color: rgba(255,255,255,0.58); font-size: 11.5px; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #vobc-lang-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.28);
      color: rgba(255,255,255,0.88); cursor: pointer;
      padding: 4px 9px; border-radius: 12px;
      font-size: 11px; font-family: 'Poppins', sans-serif;
      font-weight: 600; letter-spacing: 0.5px; flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }
    #vobc-lang-btn:hover { background: rgba(255,255,255,0.22); color: #fff; }
    #vobc-close-btn {
      background: rgba(255,255,255,0.1); border: none;
      color: rgba(255,255,255,0.65); cursor: pointer;
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 16px; line-height: 1;
      transition: background 0.2s, color 0.2s;
    }
    #vobc-close-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

    /* ── MESSAGES ─────────────────────────────────────── */
    #vobc-messages {
      flex: 1; overflow-y: auto; padding: 16px 14px;
      display: flex; flex-direction: column; gap: 12px;
      min-height: 0; scroll-behavior: smooth;
    }
    #vobc-messages::-webkit-scrollbar { width: 4px; }
    #vobc-messages::-webkit-scrollbar-track { background: transparent; }
    #vobc-messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    .vobc-msg-row { display: flex; align-items: flex-end; gap: 8px; }
    .vobc-msg-row.user { flex-direction: row-reverse; }
    .vobc-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--navy); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px; flex-shrink: 0;
      font-family: 'Poppins', sans-serif;
    }
    .vobc-bubble-text {
      max-width: 78%; padding: 10px 14px; border-radius: 18px;
      font-size: 13.5px; line-height: 1.55; word-break: break-word;
    }
    .vobc-msg-row.bot  .vobc-bubble-text {
      background: #fff; color: var(--text);
      border: 1px solid #e8e8e8; border-bottom-left-radius: 4px;
    }
    .vobc-msg-row.bot .vobc-bubble-text a { color: var(--navy); text-decoration: underline; word-break: break-all; }
    .vobc-msg-row.user .vobc-bubble-text {
      background: var(--navy); color: #fff; border-bottom-right-radius: 4px;
    }

    /* ── TYPING INDICATOR ─────────────────────────────── */
    #vobc-typing { display: none; align-items: flex-end; gap: 8px; }
    .vobc-typing-dots {
      background: var(--light-bg); padding: 13px 16px;
      border-radius: 18px; border-bottom-left-radius: 4px;
      display: flex; gap: 5px; align-items: center;
    }
    .vobc-dot { width: 7px; height: 7px; background: #aaa; border-radius: 50%; animation: vobcBounce 1.4s ease-in-out infinite; }
    .vobc-dot:nth-child(2) { animation-delay: 0.2s; }
    .vobc-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes vobcBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ── QUICK REPLIES ────────────────────────────────── */
    #vobc-quick-replies {
      padding: 0 14px 12px; display: flex; flex-wrap: wrap; gap: 7px; flex-shrink: 0;
    }
    .vobc-qr-btn {
      background: none; border: 1.5px solid var(--navy); color: var(--navy);
      border-radius: 20px; padding: 6px 13px; font-size: 12px; cursor: pointer;
      font-family: 'Rubik', Helvetica, Arial, sans-serif;
      font-weight: 500; line-height: 1.4; transition: background 0.2s, color 0.2s;
    }
    .vobc-qr-btn:hover { background: var(--navy); color: #fff; }

    /* ── INPUT AREA ───────────────────────────────────── */
    #vobc-input-area {
      padding: 10px 12px; border-top: 1px solid var(--border);
      display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0; background: #fff;
    }
    #vobc-textarea {
      flex: 1; resize: none; border: 1.5px solid #ddd; border-radius: 22px;
      padding: 10px 14px; font-size: 13.5px;
      font-family: 'Rubik', Helvetica, Arial, sans-serif;
      line-height: 1.45; outline: none; overflow-y: auto;
      height: 40px; max-height: 80px; color: var(--text); background: #f9f9f9;
      transition: border-color 0.2s, background 0.2s;
    }
    #vobc-textarea:focus { border-color: var(--navy); background: #fff; }
    #vobc-textarea::placeholder { color: #bbb; }
    #vobc-send-btn {
      width: 40px; height: 40px; border-radius: 50%; background: var(--navy);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s, transform 0.1s;
    }
    #vobc-send-btn:hover   { background: var(--gold-dk); }
    #vobc-send-btn:active  { transform: scale(0.9); }
    #vobc-send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    #vobc-send-btn svg {
      width: 18px; height: 18px; fill: none; stroke: #fff;
      stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── FOLLOW-UP PROMPTS ───────────────────────────── */
    .vobc-followup-row { display: flex; flex-direction: column; gap: 8px; padding: 4px 0; }
    .vobc-followup-label { font-size: 12px; color: #888; font-family: 'Rubik', sans-serif; text-align: center; }
    .vobc-followup-btns { display: flex; flex-wrap: wrap; gap: 7px; }

    /* ── LEAD CAPTURE CARD ───────────────────────────── */
    .vobc-lead-card {
      background: #f4f7ff; border: 1.5px solid #c8d5f0;
      border-radius: 14px; padding: 14px;
      font-family: 'Rubik', sans-serif; width: 100%;
    }
    .vobc-lead-card-title {
      font-family: 'Poppins', sans-serif; font-weight: 600;
      font-size: 13px; color: var(--navy-dk); margin-bottom: 3px;
    }
    .vobc-lead-card-sub { font-size: 12px; color: #666; margin-bottom: 10px; line-height: 1.4; }
    .vobc-lead-input {
      width: 100%; padding: 8px 11px; border: 1.5px solid #ddd;
      border-radius: 9px; font-size: 12.5px;
      font-family: 'Rubik', sans-serif; margin-bottom: 7px;
      outline: none; background: #fff; color: var(--text);
      transition: border-color 0.2s;
    }
    .vobc-lead-input:focus { border-color: var(--navy); }
    .vobc-lead-submit {
      width: 100%; padding: 9px; background: var(--navy); color: #fff;
      border: none; border-radius: 9px; font-size: 13px;
      font-family: 'Poppins', sans-serif; font-weight: 600;
      cursor: pointer; margin-bottom: 7px; transition: background 0.2s;
    }
    .vobc-lead-submit:hover { background: var(--navy-dk); }
    .vobc-lead-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .vobc-lead-skip {
      display: block; width: 100%; text-align: center;
      background: none; border: none; color: #aaa; font-size: 11.5px;
      cursor: pointer; font-family: 'Rubik', sans-serif;
      padding: 2px; transition: color 0.2s;
    }
    .vobc-lead-skip:hover { color: #666; }
    .vobc-lead-success {
      font-size: 13px; color: #1a6e2a; text-align: center;
      padding: 6px 0; font-family: 'Rubik', sans-serif;
    }

    /* ── FOOTER ───────────────────────────────────────── */
    #vobc-footer {
      padding: 6px 16px 10px; text-align: center; font-size: 10.5px;
      color: #bbb; flex-shrink: 0; background: #fafafa;
      border-top: 1px solid #f0f0f0; font-family: 'Rubik', sans-serif;
    }

    /* ── MOBILE ───────────────────────────────────────── */
    @media (max-width: 480px) {
      #vobc-window {
        right: 10px; left: 10px; width: auto;
        bottom: 80px; height: 480px; max-height: calc(100vh - 100px);
      }
      #vobc-bubble  { right: 16px; bottom: 16px; width: 56px; height: 56px; }
      #vobc-tooltip { right: 12px; bottom: 82px; font-size: 12px; }
    }
  </style>
</head>
<body>

<!-- ── FLOATING BUBBLE ──────────────────────────────── -->
<button id="vobc-bubble" aria-label="Open VOBC Help Desk">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
</button>

<!-- ── TOOLTIP ──────────────────────────────────────── -->
<div id="vobc-tooltip">Have a question about VOBC?</div>

<!-- ── CHAT WINDOW ──────────────────────────────────── -->
<div id="vobc-window" role="dialog" aria-label="VOBC Help Desk">

  <!-- Header -->
  <div id="vobc-header">
    <div id="vobc-logo-wrap">
      <img id="vobc-logo"
           src="https://vobiblecollege.org/wp-content/uploads/2021/09/cropped-VOBC-Favicon-180x180.png"
           alt="VOBC"
           onerror="this.style.display='none'">
      <div id="vobc-online-dot"></div>
    </div>
    <div id="vobc-header-text">
      <div id="vobc-header-title">VOBC Help Desk</div>
      <div id="vobc-header-subtitle">Victory Outreach Bible College</div>
    </div>
    <button id="vobc-lang-btn" aria-label="Switch language">ES</button>
    <button id="vobc-close-btn" aria-label="Close chat">&#x2715;</button>
  </div>

  <!-- Messages -->
  <div id="vobc-messages" role="log" aria-live="polite">
    <div id="vobc-typing">
      <div class="vobc-avatar">V</div>
      <div class="vobc-typing-dots">
        <div class="vobc-dot"></div>
        <div class="vobc-dot"></div>
        <div class="vobc-dot"></div>
      </div>
    </div>
  </div>

  <!-- Quick Replies -->
  <div id="vobc-quick-replies">
    <button class="vobc-qr-btn">How do I apply?</button>
    <button class="vobc-qr-btn">What programs do you offer?</button>
    <button class="vobc-qr-btn">How much does it cost?</button>
    <button class="vobc-qr-btn">When does the next quarter start?</button>
  </div>

  <!-- Input -->
  <div id="vobc-input-area">
    <textarea id="vobc-textarea"
              placeholder="Type a message…"
              rows="1"
              aria-label="Type your message"></textarea>
    <button id="vobc-send-btn" aria-label="Send message">
      <svg viewBox="0 0 24 24">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <!-- Footer -->
  <div id="vobc-footer">Powered by VOBC&nbsp;&bull;&nbsp;AI responses may not be fully accurate</div>

</div>

<script>
  // ── CONFIG ────────────────────────────────────────────────────────────────────
  // The Groq API key lives server-side now (Netlify env var GROQ_API_KEY), read by
  // netlify/functions/chat.js. Nothing secret is shipped to the browser anymore.
  var CHAT_ENDPOINT = '/.netlify/functions/chat';
  var MODEL      = 'llama-3.1-8b-instant';
  var MAX_TOKENS = 600;

  // Paste your deployed Google Apps Script Web App URL here
  // This single URL handles both lead submissions and conversation logging
  var WEBHOOK_URL = 'YOUR_APPS_SCRIPT_URL_HERE';

  // Optional: URL of your published Google Sheet CSV for live knowledge base updates
  // Leave empty to use the built-in knowledge base only
  var KNOWLEDGE_BASE_URL = '';

  // ── DATE & NEXT QUARTER ───────────────────────────────────────────────────────
  var _now    = new Date();
  var _months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var _monthsEs = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var TODAY_STR = _months[_now.getMonth()] + ' ' + _now.getDate() + ', ' + _now.getFullYear();

  // Enrollment opens on the same day-of-month, one calendar month before the quarter start.
  // Scholarship deadline is always exactly 3 weeks (21 days) before the quarter start —
  // since every quarter starts on a Monday, this always lands on a Monday too (never a weekend).
  function _addMonths(d, n) { var r = new Date(d); r.setMonth(r.getMonth() + n); return r; }
  function _addDays(d, n)   { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function _fmtEn(d) { return _months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
  function _fmtEs(d) { return d.getDate() + ' de ' + _monthsEs[d.getMonth()] + ' de ' + d.getFullYear(); }

  // Built with new Date(year, monthIndex, day) — always local time — instead of ISO strings
  // ('2026-01-19' parses as UTC midnight, which reads back as the previous day in any
  // timezone west of UTC, e.g. Sept 14 showing as Sept 13 for US visitors).
  var _quarters = [
    { name: 'Winter',  nameEs: 'Invierno',  date: new Date(2026, 0, 19) },
    { name: 'Spring',  nameEs: 'Primavera', date: new Date(2026, 3, 13) },
    { name: 'Summer',  nameEs: 'Verano',    date: new Date(2026, 6, 13) },
    { name: 'Fall',    nameEs: 'Otoño',     date: new Date(2026, 8, 14) },
    { name: 'Winter',  nameEs: 'Invierno',  date: new Date(2027, 0, 1) }
  ];
  _quarters.forEach(function(q) {
    q.enrollOpen  = _addMonths(q.date, -1);
    q.schDeadline = _addDays(q.date, -21);
  });

  var _next = _quarters.find(function(q) { return q.date > _now; });
  var _nextQtrEn = _next
    ? _next.name + ' quarter, starting ' + _fmtEn(_next.date)
    : 'the next quarter — please contact VOBC for the updated schedule';
  var _nextQtrEs = _next
    ? 'trimestre de ' + _next.nameEs + ', que comienza el ' + _fmtEs(_next.date)
    : 'el próximo trimestre — comunícate con VOBC para el horario actualizado';

  var _quarterLinesEn = _quarters.slice(0, 4).map(function(q) {
    return '- ' + q.name + ' ' + q.date.getFullYear() + ': starts ' + _fmtEn(q.date) +
      '. Enrollment opens ' + _fmtEn(q.enrollOpen) + '. Scholarship application deadline: ' + _fmtEn(q.schDeadline) + '.';
  }).join('\n');
  var _quarterLinesEs = _quarters.slice(0, 4).map(function(q) {
    return '- ' + q.nameEs + ' ' + q.date.getFullYear() + ': comienza el ' + _fmtEs(q.date) +
      '. La inscripción abre el ' + _fmtEs(q.enrollOpen) + '. Fecha límite de solicitud de beca: ' + _fmtEs(q.schDeadline) + '.';
  }).join('\n');

  // ── LANGUAGE ──────────────────────────────────────────────────────────────────
  var lang = localStorage.getItem('vobc_lang') || 'en';

  var UI = {
    en: {
      placeholder:    'Type a message…',
      footer:         'Powered by VOBC • AI responses may not be fully accurate',
      followupLabel:  'Is there anything else I can help you with?',
      quickReplies:   ['How do I apply?', 'What programs do you offer?', 'How much does it cost?', 'When does the next quarter start?'],
      followups:      ['How do I apply?', 'What programs do you offer?', 'How much does it cost?', 'When does the next quarter start?', 'How do I contact VOBC?'],
      langBtn:        'ES',
      tooltip:        'Have a question about VOBC?',
      leadTitle:      'Talk to an Admissions Counselor',
      leadSub:        'Leave your info and we\'ll reach out to you.',
      leadName:       'Full Name',
      leadEmail:      'Email Address',
      leadPhone:      'Phone Number (optional)',
      leadSubmit:     'Send My Info',
      leadSuccess:    'Thank you! An admissions counselor will contact you soon.',
      leadSkip:       'No thanks'
    },
    es: {
      placeholder:    'Escribe un mensaje…',
      footer:         'Desarrollado por VOBC • Las respuestas de IA pueden no ser completamente precisas',
      followupLabel:  '¿Hay algo más en lo que pueda ayudarte?',
      quickReplies:   ['¿Cómo me inscribo?', '¿Qué programas ofrecen?', '¿Cuánto cuesta?', '¿Cuándo empieza el próximo trimestre?'],
      followups:      ['¿Cómo me inscribo?', '¿Qué programas ofrecen?', '¿Cuánto cuesta?', '¿Cuándo empieza el próximo trimestre?', '¿Cómo contacto a VOBC?'],
      langBtn:        'EN',
      tooltip:        '¿Tienes preguntas sobre VOBC?',
      leadTitle:      'Habla con un Consejero de Admisiones',
      leadSub:        'Déjanos tu información y nos comunicaremos contigo.',
      leadName:       'Nombre Completo',
      leadEmail:      'Correo Electrónico',
      leadPhone:      'Número de Teléfono (opcional)',
      leadSubmit:     'Enviar mi Información',
      leadSuccess:    '¡Gracias! Un consejero de admisiones se pondrá en contacto contigo pronto.',
      leadSkip:       'No, gracias'
    }
  };

  // ── SYSTEM PROMPTS ────────────────────────────────────────────────────────────
  var SYSTEM_PROMPT_EN = [
    'You are the official information assistant for Victory Outreach Bible College (VOBC). Your only job is to answer questions with factual information from the knowledge base below. Use plain text only — no markdown, no asterisks, no bullet symbols, no bold, no italic. Never use the term VETI. Keep responses under 150 words unless a detailed answer truly requires more. STRICT RULES: Never add motivational phrases, spiritual encouragements, opinions, compliments, or filler. Never say things like "You got this!", "Great question!", "We are here to help you grow in your faith", "pursue your ministry calling", "God bless you", or any similar phrases. Do not editorialize. Do not add anything beyond the direct factual answer to the question asked. If the question is not covered in the knowledge base, say only: "I don\'t have that information. Please contact us at info@vobiblecollege.org or call (909) 599-4437."',
    '',
    'PROGRAMS:',
    '- Associate in Biblical and Theological Studies: 2-year program, 24 courses (72 units total), 19 required + 5 elective. Enroll in 1-3 courses at a time. No minimum per term, no time limit.',
    '- Bachelor in Christian Ministry: 18-month program, 42 units (6 modules), for students who completed an Associate degree in Bible or theology. Classes meet Saturdays 8am-12pm PST via Zoom.',
    '- Both programs available in English and Spanish.',
    '- VOBC is open to anyone interested in biblical education. No need to attend a Victory Outreach Church.',
    '- Director: Pastor Nick Gonzalez, M.Div.',
    '',
    'TUITION (USA):',
    '- Application fee: $25, one-time, required for new students.',
    '- Associate program: $215 per 3-unit course. 1-unit courses: $100. Textbooks not included.',
    '- Most courses require one book. Church History 3 requires two books.',
    '- Associate total cost: 24 courses x $215 = $5,160 + $600 estimated textbooks = $5,760.00 total.',
    '- Audit (non-credit): $100 per course in the USA.',
    '- Associate payment: full amount due at time of enrollment. No payment plans.',
    '- Bachelor program: $75 per unit, $3,150 total for 42 units. Payment plan: 50% at registration, 50% three weeks later.',

  // ── KNOWLEDGE BASE FETCH (Feature 9) ─────────────────────────────────────────
  function loadKnowledgeBase(callback) {
    if (!KNOWLEDGE_BASE_URL) { callback(); return; }
    fetch(KNOWLEDGE_BASE_URL)
      .then(function(r) { return r.text(); })
      .then(function(csv) {
        var lines = csv.split('\n').slice(1);
        var facts = [];
        lines.forEach(function(line) {
          var cols = line.split(',');
          if (cols.length >= 2 && cols[1] && cols[1].trim()) {
            facts.push(cols[0].trim() + ': ' + cols.slice(1).join(',').trim());
          }
        });
        if (facts.length > 0) {
          extraKnowledge = '\n\nLIVE KNOWLEDGE BASE UPDATES:\n' + facts.join('\n');
        }
        callback();
      })
      .catch(function() { callback(); });
  }

  function escHtml(s) {
    return s
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function linkify(escapedText) {
    return escapedText.replace(/(https?:\/\/[^\s<]+)/g, function(url) {
      return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + '</a>';
    });
  }
  function appendBot(text) {
    var row = document.createElement('div');
    row.className = 'vobc-msg-row bot';
    row.innerHTML = '<div class="vobc-avatar">V</div>' +
      '<div class="vobc-bubble-text">' + linkify(escHtml(text)).replace(/\n/g, '<br>') + '</div>';
    msgList.insertBefore(row, typingEl);
    scrollBottom();
  }
  function appendUser(text) {
    var row = document.createElement('div');
    row.className = 'vobc-msg-row user';
    row.innerHTML = '<div class="vobc-bubble-text">' + escHtml(text).replace(/\n/g, '<br>') + '</div>';
    msgList.insertBefore(row, typingEl);
    scrollBottom();
  }
  function scrollBottom() { msgList.scrollTop = msgList.scrollHeight; }

    var m = text.match(/(?:i['']?m|my name is|i am|call me|this is)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/i);
    if (m && m[1]) {

      localStorage.setItem('vobc_name', savedName);
    }
  }

    scholarships:['scholarship','beca','financial','aid','ayuda financiera'],
    contact:     ['contact','phone','email','address','contacto','teléfono','correo','direcci']
  };
  function detectTopic(text) {
    var lower = text.toLowerCase();
    for (var topic in TOPICS) {
      var words = TOPICS[topic];
      for (var i = 0; i < words.length; i++) {
        if (lower.indexOf(words[i]) !== -1) return topic;
      }
    }
    return '';
  }

    card.className = 'vobc-msg-row bot';
    card.id = 'vobc-lead-row';
    card.innerHTML =
      '<div class="vobc-avatar">V</div>' +
      '<div class="vobc-bubble-text" style="max-width:92%;padding:0;background:none;border:none;">' +
        '<div class="vobc-lead-card">' +
          '<div class="vobc-lead-card-title">' + escHtml(t.leadTitle) + '</div>' +
          '<div class="vobc-lead-card-sub">' + escHtml(t.leadSub) + '</div>' +
          '<input class="vobc-lead-input" id="vobc-l-name"  type="text"  placeholder="' + escHtml(t.leadName)  + '" autocomplete="name">' +
          '<input class="vobc-lead-input" id="vobc-l-email" type="email" placeholder="' + escHtml(t.leadEmail) + '" autocomplete="email">' +
          '<input class="vobc-lead-input" id="vobc-l-phone" type="tel"   placeholder="' + escHtml(t.leadPhone) + '" autocomplete="tel">' +
          '<button class="vobc-lead-submit" id="vobc-l-submit">' + escHtml(t.leadSubmit) + '</button>' +
          '<button class="vobc-lead-skip"   id="vobc-l-skip">'   + escHtml(t.leadSkip)   + '</button>' +
        '</div>' +
      '</div>';

    msgList.insertBefore(card, typingEl);
    scrollBottom();

    document.getElementById('vobc-l-submit').addEventListener('click', function() {
      var name  = document.getElementById('vobc-l-name').value.trim();
      var email = document.getElementById('vobc-l-email').value.trim();
      var phone = document.getElementById('vobc-l-phone').value.trim();

      document.getElementById('vobc-l-name').style.borderColor  = name  ? '#ddd' : '#cc2200';
      document.getElementById('vobc-l-email').style.borderColor = email ? '#ddd' : '#cc2200';
      if (!name || !email) return;

      document.getElementById('vobc-l-submit').disabled = true;
      savedName = name;
      localStorage.setItem('vobc_name', name);
      localStorage.setItem('vobc_lead_sent', 'true');
      leadSubmitted = true;

      if (WEBHOOK_URL && WEBHOOK_URL !== 'YOUR_APPS_SCRIPT_URL_HERE') {
        fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'lead', name: name, email: email, phone: phone,
            page: window.location.href, lastQuestion: lastUserMsg, lang: lang
          })
        }).catch(function() {});
      }

      card.querySelector('.vobc-lead-card').innerHTML =
        '<div class="vobc-lead-success">' + escHtml(t.leadSuccess) + '</div>';
      scrollBottom();
    });

    document.getElementById('vobc-l-skip').addEventListener('click', function() {
      card.remove();
    });
  }

  // ── CONVERSATION LOGGING (Feature 3) ─────────────────────────────────────────
  function logConversation(question, answer) {
    if (!WEBHOOK_URL || WEBHOOK_URL === 'YOUR_APPS_SCRIPT_URL_HERE') return;
    fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        type: 'conversation', question: question, answer: answer,
        page: window.location.href, lang: lang
      })
    }).catch(function() {});
  }

  // ── SEND MESSAGE ──────────────────────────────────────────────────────────────
  function sendMessage(text) {
    text = text.trim();
    if (!text || sendBtn.disabled) return;

    if (!firstMsgSent) {
      firstMsgSent = true;
      qrContainer.style.display = 'none';
    }

    tryExtractName(text);
    var topic = detectTopic(text);
    if (topic) localStorage.setItem('vobc_last_topic', topic);

    appendUser(text);
    textarea.value = '';
    textarea.style.height = '40px';
    chatHistory.push({ role: 'user', content: text });
    msgCount++;

    typingEl.style.display = 'flex';
    scrollBottom();
    sendBtn.disabled  = true;
    textarea.disabled = true;

    var systemPrompt = (lang === 'es' ? SYSTEM_PROMPT_ES : SYSTEM_PROMPT_EN) + extraKnowledge;

    fetch(CHAT_ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: MAX_TOKENS,
        messages: [{ role: 'system', content: systemPrompt }].concat(chatHistory)
      })
    })
    .then(function(res) {
      if (!res.ok) { return res.json().then(function(e){ throw new Error('HTTP ' + res.status); }); }
      return res.json();
    })
    .then(function(data) {
      var reply = data.choices[0].message.content
        .replace(/\*\*\*(.*?)\*\*\*/g, '$1')
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1')
        .replace(/\*+/g, '');
      chatHistory.push({ role: 'assistant', content: reply });
      typingEl.style.display = 'none';
      appendBot(reply);
      showFollowUps();
      logConversation(text, reply);

      if (!leadSubmitted && !leadShownSession) {
        if (isAdmissionsIntent(text) || msgCount >= 3) {
          setTimeout(showLeadCapture, 700);
        }
      }
    })
    .catch(function() {
      typingEl.style.display = 'none';
      appendBot(lang === 'es'
        ? 'Tengo problemas para conectarme. Contáctenos en info@vobiblecollege.org o llame al (909) 599-4437.'
        : "I'm having trouble connecting right now. Please contact us at info@vobiblecollege.org or call (909) 599-4437.");
    })
    .finally(function() {
      sendBtn.disabled  = false;
      textarea.disabled = false;
      textarea.focus();
    });
  }

  // ── FOLLOW-UP PROMPTS ─────────────────────────────────────────────────────────
  function showFollowUps() {
    var existing = msgList.querySelector('.vobc-followup-row');
    if (existing) existing.remove();
    var t = UI[lang];

    var row = document.createElement('div');
    row.className = 'vobc-followup-row';

    var label = document.createElement('div');
    label.className = 'vobc-followup-label';
    label.textContent = t.followupLabel;
    row.appendChild(label);

    var btnWrap = document.createElement('div');
    btnWrap.className = 'vobc-followup-btns';
    t.followups.forEach(function(p) {
      var btn = document.createElement('button');
      btn.className = 'vobc-qr-btn';
      btn.textContent = p;
      btn.addEventListener('click', function() { row.remove(); sendMessage(p); });
      btnWrap.appendChild(btn);
    });
    row.appendChild(btnWrap);
    msgList.insertBefore(row, typingEl);
    scrollBottom();
  }

  // ── LANGUAGE TOGGLE (Feature 2) ───────────────────────────────────────────────
  langBtn.addEventListener('click', function() {
    lang = lang === 'en' ? 'es' : 'en';
    localStorage.setItem('vobc_lang', lang);
    applyLangUI();

    // Clear chat and restart in new language
    chatHistory      = [];
    msgCount         = 0;
    firstMsgSent     = false;
    leadShownSession = false;
    while (msgList.firstChild && msgList.firstChild !== typingEl) {
      msgList.removeChild(msgList.firstChild);
    }
    qrContainer.style.display = 'flex';
    appendBot(getWelcomeMessage());
  });

  // ── SEND BUTTON & KEYBOARD ────────────────────────────────────────────────────
  sendBtn.addEventListener('click', function() {
    var existing = msgList.querySelector('.vobc-followup-row');
    if (existing) existing.remove();
    sendMessage(textarea.value);
  });
  textarea.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      var existing = msgList.querySelector('.vobc-followup-row');
      if (existing) existing.remove();
      sendMessage(textarea.value);
    }
  });
  textarea.addEventListener('input', function() {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 80) + 'px';
  });

  // ── QUICK REPLY BUTTONS ───────────────────────────────────────────────────────
  qrContainer.querySelectorAll('.vobc-qr-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { sendMessage(btn.textContent); });
  });

  // ── MOVE TO BODY (fixes position:fixed in WordPress) ─────────────────────────
  document.body.appendChild(bubble);
  document.body.appendChild(tooltip);
  document.body.appendChild(win);
</script>

</body>
